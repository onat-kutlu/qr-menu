spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/qrmenu
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms

logging:
  level:
    root: INFO
    com.qrmenu: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  file:
    name: storage/logs/application-local.log

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:local-qr-menu-jwt-secret-2026-development-only-change-this-value-0001}
