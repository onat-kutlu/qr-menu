spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:qrmenu}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: WARN
    com.qrmenu: INFO
  file:
    name: storage/logs/application-preprod.log
    max-size: 100MB
    max-history: 30

server:
  port: 8080
  ssl:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production}
  storage:
    cdn-enabled: false
