spring:
  application:
    name: qr-menu
  profiles:
    active: local
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  task:
    execution:
      pool:
        core-size: 5
        queue-capacity: 100
        max-size: 10
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration & App Config
app:
  name: QR Menu
  version: 0.0.1-MVP
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}
  storage:
    path: ${STORAGE_PATH:storage}
    max-file-size-mb: 10
    pdf-max-pages: 30
  jwt:
    secret: ${JWT_SECRET:local-qr-menu-jwt-secret-2026-development-only-change-this-value-0001}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds
    refresh-threshold: ${JWT_REFRESH_THRESHOLD:300000}  # 5 minutes
    expiration-hours: 24
    refresh-token-expiration-days: 7

logging:
  level:
    root: INFO
    com.qrmenu: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: storage/logs/application.log
    max-size: 100MB
    max-history: 30

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true
